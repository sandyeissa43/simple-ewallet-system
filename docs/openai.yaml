openapi: 3.0.3

info:
  title: Simple E-Wallet API
  description: REST API for the Simple E-Wallet System
  version: 1.0.0

servers:
  - url: http://localhost:8080
    description: Local Development Server

tags:
  - name: Users
    description: User management APIs

  - name: Wallets
    description: Wallet operations APIs

  - name: Transactions
    description: Transaction APIs

paths:

  /users:
    post:
      tags:
        - Users
      summary: Create a new user
      description: Creates a new user with the provided information
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRequest'
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Invalid user data

    get:
      tags:
        - Users
      summary: Get all users
      description: Retrieves a list of all users
      responses:
        '200':
          description: Users retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserResponse'

  /users/{id}:
    get:
      tags:
        - Users
      summary: Get user by ID
      description: Retrieves a user by their unique ID
      parameters:
        - name: id
          in: path
          required: true
          description: User ID
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: User retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '404':
          description: User not found

    put:
      tags:
        - Users
      summary: Update user
      description: Updates an existing user's information
      parameters:
        - name: id
          in: path
          required: true
          description: User ID
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRequest'
      responses:
        '200':
          description: User updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Invalid user data
        '404':
          description: User not found

  /users/{id}/deactivate:
    patch:
      tags:
        - Users
      summary: Deactivate user
      description: Deactivates an active user by their ID
      parameters:
        - name: id
          in: path
          required: true
          description: User ID
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: User deactivated successfully
          content:
            text/plain:
              schema:
                type: string
                example: User deactivated successfully
        '404':
          description: User not found

  /wallets/{walletId}:
    get:
      tags:
        - Wallets
      summary: Get wallet by ID
      description: Retrieves a wallet by its unique ID
      parameters:
        - name: walletId
          in: path
          required: true
          description: Wallet ID
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Wallet retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletResponse'
        '404':
          description: Wallet not found

  /wallets/{walletId}/balance:
    get:
      tags:
        - Wallets
      summary: Get wallet balance
      description: Retrieves the current balance of a wallet
      parameters:
        - name: walletId
          in: path
          required: true
          description: Wallet ID
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Wallet balance retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletBalanceResponse'
        '404':
          description: Wallet not found

  /wallets/{walletId}/deposit:
    post:
      tags:
        - Wallets
      summary: Deposit money
      description: Deposits money into a wallet
      parameters:
        - name: walletId
          in: path
          required: true
          description: Wallet ID
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepositRequest'
      responses:
        '200':
          description: Money deposited successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletResponse'
        '400':
          description: Invalid deposit data
        '404':
          description: Wallet not found

components:
  schemas:

    UserRequest:
      type: object
      required:
        - fullName
        - email
        - password
        - role
      properties:
        fullName:
          type: string
          minLength: 3
          maxLength: 50
          example: Sandy Eissa
          description: User's full name

        email:
          type: string
          format: email
          example: sandy@example.com
          description: User's email address



        role:
          $ref: '#/components/schemas/Role'

    UserResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1

        fullName:
          type: string
          example: Sandy Eissa

        email:
          type: string
          format: email
          example: sandy@example.com

        role:
          $ref: '#/components/schemas/Role'

        active:
          type: boolean
          example: true

        createdAt:
          type: string
          format: date-time
          example: '2026-08-17T10:30:00'

        updatedAt:
          type: string
          format: date-time
          example: '2026-08-17T10:30:00'

    Role:
      type: string
      enum:
        - USER
        - ADMIN

    WalletResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1

        balance:
          type: number
          format: double
          example: 1000.00

    WalletBalanceResponse:
      type: object
      properties:
        balance:
          type: number
          format: double
          example: 1000.00

    DepositRequest:
      type: object
      required:
        - amount
      properties:
        amount:
          type: number
          format: double
          minimum: 0.01
          example: 500.00