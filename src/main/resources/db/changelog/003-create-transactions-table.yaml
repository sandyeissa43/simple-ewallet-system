databaseChangeLog:
  - changeSet:
      id: 003-create-transactions-table
      author: sandy
      changes:
        - createTable:
            tableName: transactions
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: type
                  type: VARCHAR(50)
                  constraints:
                    nullable: false

              - column:
                  name: status
                  type: VARCHAR(50)
                  defaultValue: SUCCESS
                  constraints:
                    nullable: false

              - column:
                  name: amount
                  type: DECIMAL(19,2)
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: source_wallet_id
                  type: BIGINT

              - column:
                  name: destination_wallet_id
                  type: BIGINT

        - addForeignKeyConstraint:
            baseTableName: transactions
            baseColumnNames: source_wallet_id
            referencedTableName: wallets
            referencedColumnNames: id
            constraintName: fk_transaction_source_wallet

        - addForeignKeyConstraint:
            baseTableName: transactions
            baseColumnNames: destination_wallet_id
            referencedTableName: wallets
            referencedColumnNames: id
            constraintName: fk_transaction_destination_wallet